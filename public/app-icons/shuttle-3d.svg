<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240">
  <defs>
    <linearGradient id="skirt" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#d9d4ca"/>
      <stop offset="0.28" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f6f3ed"/>
      <stop offset="1" stop-color="#bdb6a9"/>
    </linearGradient>
    <linearGradient id="skirtShade" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#8a7f6c" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="rib" x1="0" x2="1">
      <stop offset="0" stop-color="#a99f8d" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#a99f8d" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#a99f8d" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="band" x1="0" x2="1">
      <stop offset="0" stop-color="#c58a12"/>
      <stop offset="0.35" stop-color="#ffd25a"/>
      <stop offset="1" stop-color="#a86d05"/>
    </linearGradient>
    <radialGradient id="cork" cx="0.38" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#fff6d6"/>
      <stop offset="0.45" stop-color="#f3c04a"/>
      <stop offset="1" stop-color="#a36a06"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#3a2a08" flood-opacity="0.28"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- feather skirt with scalloped top -->
    <path d="M30 40 Q42 24 54 36 Q66 22 78 34 Q90 20 100 32 Q110 20 122 34 Q134 22 146 36 Q158 24 170 40 L128 168 L72 168 Z" fill="url(#skirt)"/>
    <path d="M30 40 Q42 24 54 36 Q66 22 78 34 Q90 20 100 32 Q110 20 122 34 Q134 22 146 36 Q158 24 170 40 L128 168 L72 168 Z" fill="url(#skirtShade)"/>
    <!-- soft creases between feathers -->
    <path d="M54 36 L84 166" stroke="url(#rib)" stroke-width="6" opacity="0.5"/>
    <path d="M78 34 L93 166" stroke="url(#rib)" stroke-width="6" opacity="0.5"/>
    <path d="M122 34 L107 166" stroke="url(#rib)" stroke-width="6" opacity="0.5"/>
    <path d="M146 36 L116 166" stroke="url(#rib)" stroke-width="6" opacity="0.5"/>
    <!-- highlight down the near feathers -->
    <path d="M62 44 Q70 40 76 46 L90 160 Q84 162 80 158 Z" fill="#fff" opacity="0.7"/>
    <!-- gold band -->
    <path d="M70 160 Q100 170 130 160 L128 178 Q100 188 72 178 Z" fill="url(#band)"/>
    <!-- cork -->
    <path d="M72 176 Q100 186 128 176 Q130 214 100 222 Q70 214 72 176 Z" fill="url(#cork)"/>
    <ellipse cx="88" cy="194" rx="7" ry="10" fill="#fff" opacity="0.55"/>
  </g>
</svg>
